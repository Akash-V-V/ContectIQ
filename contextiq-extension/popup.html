<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      padding: 16px;
    }

    h1 { font-size: 18px; font-weight: 700; color: #7c6af7; margin-bottom: 4px; }
    .subtitle { font-size: 12px; color: #888; margin-bottom: 16px; }

    input {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #f0f0f0;
      font-size: 13px;
      padding: 10px;
      outline: none;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      height: 110px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #f0f0f0;
      font-size: 13px;
      padding: 10px;
      resize: none;
      outline: none;
      margin-bottom: 12px;
    }

    input::placeholder, textarea::placeholder { color: #555; }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    button {
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      background: #1e1e2e;
      color: #c0c0f0;
      transition: background 0.2s;
    }

    button:hover { background: #2a2a3e; }

    .btn-primary {
      width: 100%;
      background: #7c6af7;
      color: white;
      padding: 10px;
      font-size: 14px;
      margin-top: 4px;
    }

    .btn-primary:hover { background: #6a58e0; }
    .btn-primary:disabled { background: #444; cursor: not-allowed; }

    #btn-run {
      grid-column: span 2;
      background: #7c6af7;
      color: white;
      padding: 10px;
      font-size: 14px;
    }

    #btn-run:hover { background: #6a58e0; }
    #btn-run:disabled { background: #444; cursor: not-allowed; }

    .result-box {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      line-height: 1.6;
      min-height: 60px;
      white-space: pre-wrap;
      color: #ccc;
      display: none;
    }

    .usage { font-size: 11px; color: #666; margin-top: 10px; text-align: right; }
    .error { color: #f87171; }

    .user-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 12px;
      color: #888;
    }

    .signout-btn {
      background: none;
      border: none;
      color: #f87171;
      font-size: 11px;
      cursor: pointer;
      padding: 2px 6px;
    }

    .divider { border: none; border-top: 1px solid #2a2a2a; margin: 12px 0; }

    #login-view, #app-view { display: none; }
  </style>
</head>
<body>
  <h1>ContextIQ</h1>
  <p class="subtitle">AI writing assistant</p>

  <!-- Login View -->
  <div id="login-view">
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />
    <button class="btn-primary" id="btn-signin">Sign In</button>
    <button class="btn-primary" id="btn-signup" style="background:#1e1e2e; margin-top:6px;">Create Account</button>
    <div class="result-box error" id="auth-error" style="margin-top:10px;"></div>
  </div>

  <!-- App View -->
  <div id="app-view">
    <div class="user-bar">
      <span id="user-email"></span>
      <div>
        <button class="signout-btn" id="btn-settings" style="color:#7c6af7;">⚙️</button>
        <button class="signout-btn" id="btn-signout">Sign out</button>
      </div>
    </div>
    <hr class="divider" />

    <!-- Settings View -->
    <div id="settings-view" style="display:none;">
      <input type="password" id="new-password" placeholder="New password (min 6 chars)" />
      <button class="btn-primary" id="btn-update-password">Update Password</button>
      <div class="result-box" id="password-msg" style="margin-top:10px;"></div>
      <button id="btn-back" style="margin-top:8px; width:100%; background:#1e1e2e; color:#888;">← Back</button>
    </div>

    <!-- Main View -->
    <div id="main-view">
      <textarea id="input" placeholder="Paste text or select text on the page..."></textarea>
      <div class="actions">
        <button data-action="summarize">📝 Summarize</button>
        <button data-action="explain">💡 Explain</button>
        <button data-action="rewrite">✏️ Rewrite</button>
        <button data-action="reply">💬 Reply</button>
        <button id="btn-run" disabled>Select an action</button>
      </div>
      <div class="result-box" id="result"></div>
      <div class="usage" id="usage"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
